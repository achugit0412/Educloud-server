
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student | EduCloud</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/staff_students.css') }}">
</head>
<body>
<div class="container py-5">
    <div class="card p-4 shadow">
        <h2 class="mb-2">Add Student</h2>
        <p>Create a new student account and academic record.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('add_student') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name *</label>
                    <input name="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email *</label>
                    <input name="email" type="email" class="form-control" required>
                </div>
                
<div class="col-md-6">
    <label class="form-label" for="studentPassword">
        Temporary Password *
    </label>

    <div class="password-wrapper">
        <input
            id="studentPassword"
            name="password"
            type="password"
            minlength="8"
            class="form-control"
            placeholder="Enter temporary password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Show password"
            aria-pressed="false"
            onclick="toggleStudentPassword()"
        >
            <i class="bi bi-eye" id="passwordEyeIcon"></i>
        </button>
    </div>
</div>

                <div class="col-md-6">
                    <label class="form-label">Register Number *</label>
                    <input name="register_no" class="form-control" required>
                </div>
                <div class="form-group">
    <label for="department">Department <span class="required">*</span></label>

    <select
        id="department"
        name="department"
        class="form-select"
        required
    >
        <option value="">Select Department</option>

        <option value="Computer Science and Engineering">
            Computer Science and Engineering
        </option>

        <option value="Artificial Intelligence and Data Science">
            Artificial Intelligence and Data Science
        </option>

        <option value="Information Technology">
            Information Technology
        </option>

        <option value="Electronics and Communication Engineering">
            Electronics and Communication Engineering
        </option>

        <option value="Electrical and Electronics Engineering">
            Electrical and Electronics Engineering
        </option>

        <option value="Mechanical Engineering">
            Mechanical Engineering
        </option>

        <option value="Civil Engineering">
            Civil Engineering
        </option>
    </select>
</div>
                <div class="col-md-3">
                    <label class="form-label">Year *</label>
                    <select name="year" class="form-select" required>
                        <option value="">Select</option>
                        <option value="1">I Year</option>
                        <option value="2">II Year</option>
                        <option value="3">III Year</option>
                        <option value="4">IV Year</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Semester *</label>
                    <input name="semester" type="number" min="1"
                           class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Section *</label>
                    <input name="section" class="form-control"
                           placeholder="CSE-A" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input name="phone" type="tel" class="form-control">
                </div>
                <!-- Date of Birth -->
<div class="form-group">
    <label for="date_of_birth">Date of Birth</label>
    <input
        type="date"
        id="date_of_birth"
        name="date_of_birth"
        class="form-control"
    >
</div>

<!-- Gender -->
<div class="form-group">
    <label for="gender">Gender</label>
    <select
        id="gender"
        name="gender"
        class="form-select"
    >
        <option value="">Select Gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
    </select>
</div>
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="2"></textarea>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    Create Student
                </button>
                <a href="{{ url_for('staff_students') }}"
                   class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleStudentPassword() {
    const password = document.getElementById("studentPassword");
    const icon = document.getElementById("passwordEyeIcon");
    const button = document.getElementById("togglePassword");

    const isHidden = password.type === "password";

    password.type = isHidden ? "text" : "password";
    icon.className = isHidden
        ? "bi bi-eye-slash"
        : "bi bi-eye";

    button.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
    );

    button.setAttribute("aria-pressed", String(isHidden));
}
</script>
</body>
</html>
</body>
</html>

</body>
</html>
