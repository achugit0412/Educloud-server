
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | EduCloud</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/staff_change_password.css') }}?v=2">
</head>

<body>

    <div class="password-container">

        <h1>Change Password</h1>
        <p>Update your staff account password securely.</p>

        
<form method="POST" action="{{ url_for('staff_change_password') }}">

    <label for="current_password">Current Password</label>
    <div class="password-field">
        <input type="password" id="current_password"
               name="current_password" required>
        <button type="button" class="toggle-password"
                onclick="togglePassword('current_password', this)"
                aria-label="Show current password">👁</button>
    </div>

    <label for="new_password">New Password</label>
    <div class="password-field">
        <input type="password" id="new_password"
               name="new_password" minlength="8" required>
        <button type="button" class="toggle-password"
                onclick="togglePassword('new_password', this)"
                aria-label="Show new password">👁</button>
    </div>

    <label for="confirm_password">Confirm New Password</label>
    <div class="password-field">
        <input type="password" id="confirm_password"
               name="confirm_password" minlength="8" required>
        <button type="button" class="toggle-password"
                onclick="togglePassword('confirm_password', this)"
                aria-label="Show confirm password">👁</button>
    </div>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="success-message">{{ success }}</p>
    {% endif %}

    <button type="submit">Change Password</button>
</form>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
    } else {
        input.type = "password";
        button.textContent = "👁";
        button.setAttribute("aria-label", "Show password");
    }
}
</script>


        <a class="back-link"
           href="{{ url_for('staff_dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
